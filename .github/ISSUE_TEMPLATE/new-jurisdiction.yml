name: New jurisdiction
description: Propose adding an EU member state to the dataset.
title: "Jurisdiction: "
labels: ["data", "new-jurisdiction"]
body:
  - type: markdown
    attributes:
      value: |
        Only EU member states can be added: the EAA is an EU directive. What a jurisdiction file needs is listed in docs/contributing-data.md under "Add a jurisdiction".
  - type: dropdown
    id: jurisdiction
    attributes:
      label: Jurisdiction
      description: Member states not yet published.
      options:
        - AT (Austria)
        - BE (Belgium)
        - BG (Bulgaria)
        - CY (Cyprus)
        - CZ (Czechia)
        - DK (Denmark)
        - EE (Estonia)
        - FI (Finland)
        - FR (France)
        - GR (Greece)
        - HR (Croatia)
        - HU (Hungary)
        - IE (Ireland)
        - IT (Italy)
        - LT (Lithuania)
        - LU (Luxembourg)
        - LV (Latvia)
        - MT (Malta)
        - NL (Netherlands)
        - PL (Poland)
        - PT (Portugal)
        - RO (Romania)
        - SI (Slovenia)
        - SK (Slovakia)
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources found
      description: Official URLs for the transposing law, and for any ordinance that designates the supervisory authority. Say which are consolidated texts.
      placeholder: |
        https://…  (transposing act, consolidated text)
        https://…  (ordinance designating the authority)
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Can you help research it?
      description: Finding the provisions, quoting them and translating the quotes.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Languages of the sources, the currency of the fines, known amendments, or how you would like to be credited in CHANGELOG.md.
    validations:
      required: false
