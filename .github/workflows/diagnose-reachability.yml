name: diagnose-reachability

# Temporary: why www.gesetze-im-internet.de times out from GitHub runners.
# Removed once the cause is known.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: www.gesetze-im-internet.de
      URL: https://www.gesetze-im-internet.de/bfsg/__37.html
    steps:
      - name: Runner public address
        run: curl -s --max-time 10 https://api.ipify.org || true
      - name: DNS
        run: |
          dig +short A "$HOST" || true
          dig +short AAAA "$HOST" || true
      - name: TCP 443 over IPv4
        run: timeout 15 bash -c "</dev/tcp/$(dig +short A $HOST | tail -1)/443" && echo open || echo "no connection"
      - name: TCP 80 over IPv4
        run: timeout 15 bash -c "</dev/tcp/$(dig +short A $HOST | tail -1)/80" && echo open || echo "no connection"
      - name: curl IPv4, our user agent
        run: curl -4 -sS -o /dev/null -w "%{http_code} %{remote_ip} %{time_total}s\n" --max-time 20 -A "eaa-cite verify-sources (+https://github.com/Rez-1/eaa-cite)" "$URL" || true
      - name: curl IPv4, browser user agent
        run: curl -4 -sS -o /dev/null -w "%{http_code} %{remote_ip} %{time_total}s\n" --max-time 20 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" "$URL" || true
      - name: curl IPv6
        run: curl -6 -sS -o /dev/null -w "%{http_code} %{remote_ip} %{time_total}s\n" --max-time 20 "$URL" || true
      - name: Path to host
        run: |
          sudo apt-get install -y -qq traceroute >/dev/null 2>&1 || true
          sudo traceroute -T -p 443 -m 20 -w 2 "$HOST" || true
      - name: Control, other official hosts
        run: |
          for u in https://www.bgbl.de/ https://eur-lex.europa.eu/ https://www.boe.es/; do
            curl -4 -sS -o /dev/null -w "$u %{http_code} %{time_total}s\n" --max-time 20 "$u" || echo "$u failed"
          done
