name: verify-sources

# Re-reads every official source and checks each quote is still there.
#
# On a pull request that touches data/, this is the live check of a new or
# changed quote, so contributors without Node still get one.
#
# On the weekly schedule, a failure means a law was amended or a page moved. The
# job then opens an issue (or comments on the open one) naming the affected
# claims; a person updates the data by hand.

on:
  pull_request:
    paths:
      - "data/**"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check every quote against its source
        run: npm run --silent verify-sources -- --json > verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verification
          path: verification.json
      - name: Open or update the verify-sources issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly source check failed on $(date -u +%Y-%m-%d). Run: $RUN_URL"
            echo
            echo "| Jurisdiction | Source | Status | Detail |"
            echo "|---|---|---|---|"
            jq -r '.results[] | select(.status == "quote-missing" or .status == "fetch-failed" or .stale == true)
              | "| \(.jurisdiction) | \(.source) | \(.status)\(if .stale then ", stale" else "" end) | \(.error // ([.missing[]? | "\(.claim) (\(.pinpoint))"] | join("; ")) | if . == "" then "retrieved over a year ago" else . end) |"' verification.json
            echo
            echo "See docs/verification.md for what to do."
          } > body.md
          gh label create verify-sources --color D73A49 --description "Weekly source check failed" 2>/dev/null || true
          existing=$(gh issue list --label verify-sources --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "Source check failed" --label verify-sources --body-file body.md
          fi
