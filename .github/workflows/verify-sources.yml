name: verify-sources

# Re-reads every official source and checks each quote is still there. A
# failure means a law was amended or a page moved: open the run, read which
# claim is affected, and update the data by hand.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify-sources -- --json > verification.json || (cat verification.json && exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: verification.json
