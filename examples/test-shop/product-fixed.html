<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Linen shirt | Test Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Linen shirt</h1>
    <img src="shirt-front.svg" width="300" height="300" alt="Off-white linen shirt, front" />
    <img src="shirt-back.svg" width="300" height="300" alt="Off-white linen shirt, back" />
    <p>€49.00</p>
    <label for="size">Size</label>
    <select id="size" name="size"><option>S</option><option>M</option><option>L</option></select>
    <fieldset>
      <legend>Colour</legend>
      <label><input type="radio" name="colour" value="natural" checked /> Natural</label>
      <label><input type="radio" name="colour" value="navy" /> Navy</label>
    </fieldset>
    <button type="button">Add to cart</button>
    <video src="promo.mp4" controls width="320"><track kind="captions" src="promo.en.vtt" srclang="en" label="English" /></video>
  </main>
</body>
</html>
